<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мой крутой сайт</title>
    <style>
      /* Базовые настройки — чтобы всё выглядело современно */
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f7f6;
        color: #333;
        line-height: 1.6;
      }

      header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 60px 20px;
        text-align: center;
      }

      header h1 {
        margin: 0;
        font-size: 2.5rem;
      }

      header p {
        opacity: 0.9;
        font-size: 1.2rem;
        margin-top: 10px;
      }

      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
      }

      .card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .card img {
        width: 100%;
        height: 300px;
        object-fit: cover;
        /* object-fit: cover делает так, что картинка не сплющивается, а аккуратно обрезается по краям */
      }

      .card-content {
        padding: 30px;
        text-align: center;
      }

      .card h2 {
        color: #2c3e50;
        margin-bottom: 15px;
      }

      .btn {
        display: inline-block;
        background-color: #764ba2;
        color: white;
        padding: 12px 24px;
        text-decoration: none;
        border-radius: 6px;
        margin-top: 15px;
        transition: background 0.3s;
      }

      .btn:hover {
        background-color: #5b3a7d;
      }

      footer {
        text-align: center;
        padding: 20px;
        color: #888;
        font-size: 0.9rem;
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <!-- Шапка сайта -->
    <header>
      <h1>Добро пожаловать!</h1>
      <p>Это мой первый, но уже стильный сайт.</p>
    </header>

    <!-- Основной блок с картинкой -->
    <div class="container">
      <article class="card">
        <!-- Картинка из бесплатного стока Unsplash -->
        <img
          src="https://images.unsplash.com/photo-1497215728101-856d9bdb40b0?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
          alt="Уютная комната с книгами"
        />
        <div class="card-content">
          <h2>Почему это круто?</h2>
          <p>
            Я сделал этот сайт сам, без конструкторов. Здесь есть адаптивная верстка,
            красивые тени, градиент и кнопка, которая выглядит как кнопка, а не как ссылка.
          </p>
          <a href="#" class="btn">Узнать больше</a>
        </div>
      </article>
    </div>

    <footer>
      &copy; 2024 Мой сайт. Сделано с любовью.
    </footer>
  </body>
</html>
